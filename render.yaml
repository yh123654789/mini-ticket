# Render 部署：一个服务搞定（前端编译进镜像，由 FastAPI 直接发）
# 用法：Render → New → Web Service → Public Git repository
#       填 https://github.com/yh123654789/mini-ticket
#       Language 选 Docker，Dockerfile Path 填 ./Dockerfile
services:
  - type: web
    name: mini-ticket
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/tickets.db
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: SEED_DEMO_USERS
        value: "true"
