# Render 一键部署配置
# 用法：在 Render 里 New → Blueprint，选中这个仓库，它会读这份文件
services:
  # 后端：FastAPI（用仓库里的 Dockerfile 构建）
  - type: web
    name: mini-ticket-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/tickets.db
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: SEED_DEMO_USERS
        value: "true"

  # 前端：Vue 静态站点
  - type: web
    name: mini-ticket-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # 指向上面那个后端服务的地址（部署后把实际域名填进来）
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
